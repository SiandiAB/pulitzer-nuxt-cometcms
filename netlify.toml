[build]
  command = "npm run generate"
  # En Netlify, Nuxt detecta el entorno y usa el preset "netlify-static",
  # que genera el sitio en "dist" (localmente genera en .output/public).
  publish = "dist"

[build.environment]
  # Nuxt 4.5 / Nitro 2.13 chocan con un bug de Node 24 en la resolución de
  # @rollup/pluginutils (ERR_REQUIRE_CYCLE_MODULE). Se fija Node 22 LTS hasta
  # que haya un parche upstream.
  NODE_VERSION = "22"
